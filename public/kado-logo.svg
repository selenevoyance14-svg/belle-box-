<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 46" width="172" height="46" role="img" aria-label="Kado">
  <title>Kado</title>

  <!-- === CADEAU ICON === -->

  <!-- Box body -->
  <rect x="4" y="22" width="34" height="20" rx="3" fill="#FF6B5C"/>
  <!-- Ribbon vertical on body -->
  <rect x="18" y="22" width="7" height="20" fill="#FFC947"/>
  <!-- Box lid -->
  <rect x="2" y="15" width="38" height="9" rx="2.5" fill="#E64A3B"/>
  <!-- Ribbon vertical on lid -->
  <rect x="18" y="15" width="7" height="9" fill="#FFC947"/>

  <!-- Bow — left loop -->
  <path d="M 21.5 15.5 C 18 7, 5 5, 6 11 C 7 16, 16 16.5, 21.5 15.5 Z" fill="#FFC947"/>
  <!-- Bow — right loop -->
  <path d="M 21.5 15.5 C 25 7, 38 5, 37 11 C 36 16, 27 16.5, 21.5 15.5 Z" fill="#FFD84D"/>
  <!-- Bow — center knot -->
  <circle cx="21.5" cy="15" r="3.5" fill="#FF9800"/>

  <!-- Outline for crispness -->
  <rect x="4" y="22" width="34" height="20" rx="3" fill="none" stroke="#3D2E28" stroke-width="1.3"/>
  <rect x="2" y="15" width="38" height="9" rx="2.5" fill="none" stroke="#3D2E28" stroke-width="1.3"/>

  <!-- === WORDMARK === -->
  <text y="37"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="29" font-weight="800" letter-spacing="-0.5">
    <tspan x="50" fill="#3D2E28">K</tspan>
    <tspan fill="#FF6B5C">a</tspan>
    <tspan fill="#3D2E28">dô</tspan>
  </text>

  <!-- Squiggle underline -->
  <path d="M 50 42 Q 67 46 84 42 Q 101 38 118 42 Q 131 45 145 42"
    stroke="#FFC947" stroke-width="2.2" fill="none" stroke-linecap="round"/>
</svg>
