<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#FFEBEE"/> <!-- Fond rose pâle -->
  
  <!-- Ballons flous en arrière plan -->
  <circle cx="150" cy="150" r="80" fill="#F8BBD0" opacity="0.6"/>
  <circle cx="450" cy="100" r="90" fill="#F48FB1" opacity="0.5"/>

  <!-- Trousse florale centrale -->
  <rect x="200" y="180" width="200" height="140" rx="10" fill="#81C784"/>
  <!-- Motifs fleurs sur la trousse -->
  <circle cx="220" cy="200" r="5" fill="#E91E63"/>
  <circle cx="250" cy="230" r="5" fill="#E91E63"/>
  <circle cx="300" cy="210" r="5" fill="#E91E63"/>
  <circle cx="350" cy="250" r="5" fill="#E91E63"/>
  <circle cx="380" cy="200" r="5" fill="#E91E63"/>
  <circle cx="280" cy="280" r="5" fill="#E91E63"/>
  <circle cx="320" cy="300" r="5" fill="#E91E63"/>
  
  <!-- Produits cosmétiques -->
  <!-- Tube 1 -->
  <rect x="120" y="220" width="40" height="100" fill="#5D4037"/>
  <rect x="120" y="320" width="40" height="10" fill="#3E2723"/>
  <circle cx="140" cy="260" r="10" fill="#E91E63" opacity="0.8"/> <!-- Fleur sur tube -->

  <!-- Tube 2 -->
  <rect x="440" y="240" width="30" height="80" fill="#FFFFFF" stroke="#E0E0E0"/>
  <rect x="440" y="320" width="30" height="10" fill="#03A9F4"/>
  
  <!-- Fleurs décoratives -->
  <circle cx="100" cy="100" r="25" fill="#E91E63"/> <!-- Fleur rose vif gauche -->
  <circle cx="100" cy="100" r="10" fill="#212121"/>
  
  <circle cx="500" cy="150" r="25" fill="#F06292"/> <!-- Fleur rose droite -->
  <circle cx="500" cy="150" r="10" fill="#212121"/>

  <!-- Logo Biotyfull fictif -->
  <rect x="260" y="240" width="80" height="30" fill="white" rx="2"/>
  <text x="300" y="260" font-family="Arial, sans-serif" font-size="14" fill="#2E7D32" text-anchor="middle" font-weight="bold">BIOTYFULL</text>
</svg>
