<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- Background subtil -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="url(#bg)" rx="12"/>

  <!-- Cercle déco -->
  <circle cx="150" cy="88" r="52" fill="#ffffff" opacity="0.6"/>
  <circle cx="150" cy="88" r="44" fill="#ffffff" opacity="0.5"/>

  <!-- Feuille principale SVG (pas emoji pour compatibilité) -->
  <g transform="translate(108, 46) scale(0.52)">
    <!-- Feuille stylisée -->
    <path d="M80 10 C80 10, 10 40, 10 120 C10 150, 50 170, 80 160 C110 170, 150 150, 150 120 C150 40, 80 10, 80 10Z" fill="#4CAF50" opacity="0.9"/>
    <path d="M80 10 C80 10, 80 60, 80 160" stroke="#2E7D32" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M80 70 C80 70, 40 80, 20 100" stroke="#2E7D32" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M80 90 C80 90, 110 95, 135 110" stroke="#2E7D32" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M80 110 C80 110, 45 115, 28 130" stroke="#2E7D32" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Petites étoiles bio -->
    <circle cx="165" cy="35" r="5" fill="#FFC947"/>
    <circle cx="175" cy="55" r="3" fill="#FFC947"/>
    <circle cx="185" cy="40" r="4" fill="#FFC947"/>
  </g>

  <!-- Nom de la box -->
  <text x="150" y="156" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" fill="#1B5E20" letter-spacing="0.3">Biotyfull Box</text>

  <!-- Tagline -->
  <text x="150" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#388E3C" letter-spacing="2.5" font-weight="600">BIO &amp; NATUREL</text>
</svg>
