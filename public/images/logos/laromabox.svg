<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <radialGradient id="bg-lab" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#F3E5F5"/>
      <stop offset="100%" stop-color="#E1BEE7"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="url(#bg-lab)" rx="12"/>

  <circle cx="150" cy="88" r="52" fill="#ffffff" opacity="0.55"/>
  <circle cx="150" cy="88" r="44" fill="#ffffff" opacity="0.45"/>

  <!-- Aromathérapie: brûleur d'huiles + vapeur -->
  <g transform="translate(112, 36)">
    <!-- Flamme / bougie -->
    <path d="M38 90 Q20 90 20 72 L20 72 Q28 75 38 90Z" fill="#CE93D8" opacity="0.3"/>
    <path d="M38 90 Q56 90 56 72 L56 72 Q48 75 38 90Z" fill="#CE93D8" opacity="0.3"/>

    <!-- Bol / diffuseur -->
    <path d="M16 68 Q16 90, 38 90 Q60 90, 60 68Z" fill="#AB47BC" opacity="0.8"/>
    <path d="M16 68 Q16 90, 38 90 Q60 90, 60 68Z" fill="none" stroke="#8E24AA" stroke-width="1.5"/>
    <ellipse cx="38" cy="68" rx="22" ry="7" fill="#CE93D8"/>
    <ellipse cx="38" cy="68" rx="22" ry="7" fill="none" stroke="#8E24AA" stroke-width="1.5"/>
    <!-- Liquide dans le bol -->
    <ellipse cx="38" cy="68" rx="16" ry="4" fill="#BA68C8" opacity="0.6"/>

    <!-- Vapeurs / spirales -->
    <path d="M30 65 Q25 52, 30 42 Q35 32, 28 20" stroke="#CE93D8" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M38 62 Q33 48, 38 36 Q43 24, 36 12" stroke="#BA68C8" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M46 65 Q52 50, 46 40 Q40 30, 48 18" stroke="#CE93D8" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>

    <!-- Socle -->
    <rect x="22" y="90" width="32" height="5" rx="2.5" fill="#9C27B0" opacity="0.5"/>

    <!-- Gouttelettes d'huile -->
    <ellipse cx="8" cy="30" rx="4" ry="6" fill="#9C27B0" opacity="0.5"/>
    <ellipse cx="8" cy="34" rx="2" ry="2" fill="#9C27B0" opacity="0.5"/>
    <ellipse cx="72" cy="45" rx="3.5" ry="5" fill="#7B1FA2" opacity="0.4"/>
    <ellipse cx="72" cy="48.5" rx="1.5" ry="1.5" fill="#7B1FA2" opacity="0.4"/>

    <!-- Lavande déco -->
    <path d="M3 60 L3 80" stroke="#9C27B0" stroke-width="1.5"/>
    <ellipse cx="3" cy="57" rx="3" ry="5" fill="#BA68C8" opacity="0.7"/>
    <ellipse cx="0" cy="63" rx="2.5" ry="4" fill="#CE93D8" opacity="0.6"/>
    <ellipse cx="6" cy="64" rx="2.5" ry="4" fill="#BA68C8" opacity="0.6"/>
  </g>

  <!-- Nom -->
  <text x="150" y="154" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#4A148C" letter-spacing="0.5">L'Aroma Box</text>

  <!-- Tagline -->
  <text x="150" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#7B1FA2" letter-spacing="2" font-weight="600">AROMATHÉRAPIE</text>
</svg>
