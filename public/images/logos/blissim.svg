<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <radialGradient id="bg-blissim" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FCE4EC"/>
      <stop offset="100%" stop-color="#F8BBD9"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="url(#bg-blissim)" rx="12"/>

  <!-- Cercle central -->
  <circle cx="150" cy="88" r="52" fill="#ffffff" opacity="0.55"/>
  <circle cx="150" cy="88" r="44" fill="#ffffff" opacity="0.45"/>

  <!-- Rouge à lèvres stylisé -->
  <g transform="translate(118, 46)">
    <!-- Corps du tube -->
    <rect x="22" y="35" width="20" height="52" rx="3" fill="#E91E8C"/>
    <rect x="18" y="55" width="28" height="35" rx="3" fill="#C2185B"/>
    <!-- Capuchon -->
    <rect x="20" y="55" width="24" height="8" rx="2" fill="#AD1457"/>
    <!-- Bâton -->
    <path d="M24 35 Q32 10 40 35" fill="#FF80AB" stroke="#E91E8C" stroke-width="1"/>
    <!-- Reflet -->
    <rect x="26" y="60" width="4" height="20" rx="2" fill="#ffffff" opacity="0.3"/>
    <!-- Étoiles déco -->
    <circle cx="8" cy="20" r="3" fill="#FF80AB"/>
    <circle cx="60" cy="25" r="4" fill="#F48FB1"/>
    <circle cx="65" cy="50" r="2.5" fill="#FF80AB"/>
    <circle cx="2" cy="55" r="2" fill="#F48FB1"/>
    <!-- Sparkles -->
    <path d="M62 15 L64 20 L69 22 L64 24 L62 29 L60 24 L55 22 L60 20Z" fill="#FFC947" opacity="0.8"/>
  </g>

  <!-- Nom -->
  <text x="150" y="157" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#880E4F" letter-spacing="1.5">Blissim</text>

  <!-- Tagline -->
  <text x="150" y="177" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#C2185B" letter-spacing="3" font-weight="600">BEAUTÉ &amp; SOIN</text>
</svg>
