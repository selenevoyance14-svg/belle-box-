<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <radialGradient id="bg-mc" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="url(#bg-mc)" rx="12"/>

  <circle cx="150" cy="88" r="52" fill="#ffffff" opacity="0.55"/>
  <circle cx="150" cy="88" r="44" fill="#ffffff" opacity="0.45"/>

  <!-- Confettis joyeux + chapeau de fête -->
  <g transform="translate(108, 40)">
    <!-- Confettis colorés -->
    <rect x="5" y="5" width="10" height="6" rx="2" fill="#FF6B6B" transform="rotate(-20 10 8)"/>
    <rect x="70" y="10" width="8" height="5" rx="2" fill="#4ECDC4" transform="rotate(15 74 12)"/>
    <rect x="60" y="50" width="9" height="5" rx="2" fill="#45B7D1" transform="rotate(-10 64 52)"/>
    <rect x="0" y="55" width="7" height="5" rx="2" fill="#F7DC6F" transform="rotate(25 4 58)"/>
    <rect x="72" y="68" width="8" height="5" rx="2" fill="#BB8FCE" transform="rotate(-15 76 70)"/>
    <rect x="15" y="75" width="7" height="4" rx="2" fill="#F0B27A" transform="rotate(10 19 77)"/>
    <circle cx="12" cy="30" r="4" fill="#FF6B6B" opacity="0.8"/>
    <circle cx="75" cy="35" r="3" fill="#4ECDC4" opacity="0.8"/>
    <circle cx="68" cy="80" r="3.5" fill="#F7DC6F" opacity="0.8"/>
    <circle cx="8" cy="85" r="3" fill="#BB8FCE" opacity="0.8"/>

    <!-- Chapeau de fête -->
    <path d="M37 55 L22 90 L52 90Z" fill="#F97316"/>
    <path d="M37 55 L22 90 L52 90Z" fill="none" stroke="#EA580C" stroke-width="1.5"/>
    <!-- Bande du chapeau -->
    <rect x="22" y="82" width="30" height="8" rx="2" fill="#FED7AA"/>
    <!-- Pompon -->
    <circle cx="37" cy="55" r="6" fill="#FFC947"/>
    <circle cx="37" cy="55" r="4" fill="#FBBF24"/>
    <!-- Lignes déco sur chapeau -->
    <line x1="32" y1="63" x2="29" y2="73" stroke="#FED7AA" stroke-width="1.5"/>
    <line x1="37" y1="60" x2="37" y2="72" stroke="#FED7AA" stroke-width="1.5"/>
    <line x1="42" y1="63" x2="45" y2="73" stroke="#FED7AA" stroke-width="1.5"/>

    <!-- Serpentins -->
    <path d="M52 45 Q60 50, 55 58 Q50 66, 60 70" stroke="#FF6B6B" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M15 52 Q8 58, 14 65 Q20 72, 12 77" stroke="#4ECDC4" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Nom sur deux lignes -->
  <text x="150" y="152" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-weight="bold" fill="#9A3412" letter-spacing="0.5">Mademoiselle</text>
  <text x="150" y="167" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-weight="bold" fill="#9A3412" letter-spacing="0.5">Confettis</text>

  <!-- Tagline -->
  <text x="150" y="183" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8.5" fill="#C2410C" letter-spacing="2" font-weight="600">LIFESTYLE</text>
</svg>
