<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <radialGradient id="bg-glowria" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FFD6E7"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="url(#bg-glowria)" rx="12"/>

  <circle cx="150" cy="88" r="52" fill="#ffffff" opacity="0.55"/>
  <circle cx="150" cy="88" r="44" fill="#ffffff" opacity="0.45"/>

  <!-- Éclat / shine - représente le "glow" -->
  <g transform="translate(114, 44)">
    <!-- Soleil stylisé / glow -->
    <circle cx="36" cy="44" r="24" fill="#FFB6C1" opacity="0.7"/>
    <circle cx="36" cy="44" r="17" fill="#FF85A2" opacity="0.9"/>
    <circle cx="36" cy="44" r="11" fill="#FF5C84"/>
    <!-- Rayons -->
    <line x1="36" y1="8" x2="36" y2="18" stroke="#FF85A2" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="70" x2="36" y2="80" stroke="#FF85A2" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="44" x2="10" y2="44" stroke="#FF85A2" stroke-width="3" stroke-linecap="round"/>
    <line x1="62" y1="44" x2="72" y2="44" stroke="#FF85A2" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="14" x2="17" y2="21" stroke="#FF85A2" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="55" y1="67" x2="62" y2="74" stroke="#FF85A2" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="62" y1="14" x2="55" y2="21" stroke="#FF85A2" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="17" y1="67" x2="10" y2="74" stroke="#FF85A2" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Étoile centrale -->
    <circle cx="36" cy="44" r="5" fill="#ffffff" opacity="0.9"/>
    <!-- Sparkles autour -->
    <path d="M75 10 L76.5 14 L80 15.5 L76.5 17 L75 21 L73.5 17 L70 15.5 L73.5 14Z" fill="#D4A017" opacity="0.8"/>
    <circle cx="6" cy="75" r="3.5" fill="#FFB6C1"/>
    <circle cx="76" cy="70" r="2.5" fill="#FF85A2" opacity="0.7"/>
  </g>

  <!-- Nom -->
  <text x="150" y="156" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#B5004A" letter-spacing="1.5">Glowria</text>

  <!-- Tagline -->
  <text x="150" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#D63384" letter-spacing="2.5" font-weight="600">ÉCLAT &amp; PREMIUM</text>
</svg>
