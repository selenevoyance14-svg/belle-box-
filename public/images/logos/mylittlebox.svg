<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <radialGradient id="bg-mlb" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FCE4EC"/>
      <stop offset="100%" stop-color="#F8BBD9"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="url(#bg-mlb)" rx="12"/>

  <circle cx="150" cy="88" r="52" fill="#ffffff" opacity="0.55"/>
  <circle cx="150" cy="88" r="44" fill="#ffffff" opacity="0.45"/>

  <!-- Jolie boîte cadeau -->
  <g transform="translate(108, 44)">
    <!-- Corps de la boîte -->
    <rect x="4" y="30" width="76" height="52" rx="4" fill="#F06292"/>
    <rect x="4" y="30" width="76" height="52" rx="4" fill="none" stroke="#C2185B" stroke-width="1.5"/>
    <!-- Couvercle -->
    <rect x="0" y="20" width="84" height="16" rx="4" fill="#E91E63"/>
    <!-- Ruban horizontal -->
    <rect x="4" y="30" width="76" height="8" fill="#C2185B" opacity="0.5"/>
    <!-- Ruban vertical -->
    <rect x="38" y="20" width="8" height="62" fill="#C2185B" opacity="0.5"/>
    <!-- Nœud -->
    <ellipse cx="42" cy="22" rx="14" ry="8" fill="none" stroke="#FF80AB" stroke-width="3"/>
    <ellipse cx="42" cy="22" rx="7" ry="4" fill="#FF80AB"/>
    <!-- Points déco sur la boîte -->
    <circle cx="18" cy="50" r="3" fill="#ffffff" opacity="0.5"/>
    <circle cx="30" cy="62" r="2" fill="#ffffff" opacity="0.4"/>
    <circle cx="58" cy="48" r="2.5" fill="#ffffff" opacity="0.5"/>
    <circle cx="70" cy="60" r="2" fill="#ffffff" opacity="0.4"/>
    <!-- Étoile déco -->
    <path d="-10 10 L-8.5 14 L-5 15.5 L-8.5 17 L-10 21 L-11.5 17 L-15 15.5 L-11.5 14Z" fill="#FFC947" transform="translate(96, 10)"/>
    <circle cx="90" cy="32" r="3" fill="#FFC947" opacity="0.8"/>
  </g>

  <!-- Nom -->
  <text x="150" y="156" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#880E4F" letter-spacing="0.5">My Little Box</text>

  <!-- Tagline -->
  <text x="150" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#C2185B" letter-spacing="2.5" font-weight="600">LIFESTYLE &amp; TENDANCES</text>
</svg>
