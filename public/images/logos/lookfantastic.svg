<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <radialGradient id="bg-lf" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFECB3"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="url(#bg-lf)" rx="12"/>

  <!-- Cercle doré -->
  <circle cx="150" cy="88" r="52" fill="#ffffff" opacity="0.5"/>
  <circle cx="150" cy="88" r="44" fill="#ffffff" opacity="0.4"/>
  <circle cx="150" cy="88" r="46" fill="none" stroke="#D4A017" stroke-width="1.5" opacity="0.5"/>

  <!-- Couronne / étoile premium -->
  <g transform="translate(122, 54)">
    <!-- Bouteille de parfum stylisée -->
    <rect x="14" y="22" width="28" height="40" rx="6" fill="#1A1A2E"/>
    <rect x="18" y="28" width="8" height="30" rx="2" fill="#ffffff" opacity="0.12"/>
    <!-- Col du flacon -->
    <rect x="20" y="12" width="16" height="12" rx="3" fill="#1A1A2E"/>
    <!-- Spray -->
    <rect x="34" y="8" width="12" height="6" rx="2" fill="#1A1A2E"/>
    <circle cx="46" cy="11" r="3" fill="#D4A017"/>
    <!-- Label doré -->
    <rect x="17" y="30" width="22" height="18" rx="3" fill="#D4A017" opacity="0.9"/>
    <text x="28" y="42" text-anchor="middle" font-family="serif" font-size="7" fill="#1A1A2E" font-weight="bold">LF</text>
    <!-- Étoiles déco -->
    <path d="M5 10 L7 15 L12 17 L7 19 L5 24 L3 19 L-2 17 L3 15Z" fill="#D4A017"/>
    <path d="M58 35 L59.5 39 L63 40.5 L59.5 42 L58 46 L56.5 42 L53 40.5 L56.5 39Z" fill="#D4A017" opacity="0.7"/>
    <circle cx="62" cy="15" r="3" fill="#D4A017" opacity="0.6"/>
  </g>

  <!-- Nom -->
  <text x="150" y="155" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="bold" fill="#1A1A2E" letter-spacing="1">Lookfantastic</text>

  <!-- Tagline -->
  <text x="150" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#92400E" letter-spacing="3" font-weight="600">PREMIUM BEAUTY</text>
</svg>
