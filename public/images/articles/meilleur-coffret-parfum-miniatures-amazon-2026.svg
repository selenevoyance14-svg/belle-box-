<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fce7f3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fff5f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#fff5f7"/>
  <circle cx="200" cy="150" r="130" fill="url(#bg-glow)"/>
  
        <!-- Perfume bottle -->
        <rect x="180" y="120" width="40" height="70" rx="4" fill="#f9a8d4" opacity="0.6" stroke="#d4af37" stroke-width="1"/>
        <!-- Bottle neck -->
        <rect x="192" y="105" width="16" height="18" fill="#d4af37" opacity="0.5"/>
        <!-- Cap -->
        <rect x="188" y="95" width="24" height="14" rx="3" fill="#d4af37" opacity="0.7"/>
        <!-- Spray mist -->
        <circle cx="230" cy="110" r="3" fill="#f9a8d4" opacity="0.3"/>
        <circle cx="240" cy="100" r="2" fill="#f9a8d4" opacity="0.25"/>
        <circle cx="235" cy="95" r="2.5" fill="#f9a8d4" opacity="0.2"/>
        <!-- Mini bottles -->
        <rect x="135" y="155" width="20" height="35" rx="3" fill="#be185d" opacity="0.3"/>
        <rect x="250" y="150" width="18" height="40" rx="3" fill="#be185d" opacity="0.3"/>
        
  <!-- Decorative dots -->
  <circle cx="80" cy="50" r="3" fill="#f9a8d4" opacity="0.4"/>
  <circle cx="320" cy="60" r="2" fill="#d4af37" opacity="0.3"/>
  <circle cx="75" cy="240" r="2" fill="#be185d" opacity="0.2"/>
  <circle cx="330" cy="230" r="3" fill="#f9a8d4" opacity="0.3"/>
  <circle cx="60" cy="150" r="1.5" fill="#d4af37" opacity="0.25"/>
  <circle cx="340" cy="140" r="2" fill="#be185d" opacity="0.2"/>
</svg>