<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D"/>
      <stop offset="100%" style="stop-color:#C44BFF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Décorations géométriques -->
  <circle cx="80"  cy="80"  r="200" fill="white" opacity="0.05"/>
  <circle cx="1120" cy="550" r="280" fill="white" opacity="0.05"/>
  <circle cx="970"  cy="70"  r="140" fill="white" opacity="0.04"/>
  <circle cx="180"  cy="560" r="170" fill="white" opacity="0.03"/>
  <!-- Motif losange subtil -->
  <rect x="550" y="0" width="100" height="630" fill="white" opacity="0.02" transform="rotate(12 600 315)"/>
  <!-- Badge catégorie -->
  <rect x="450" y="72" width="300" height="46" rx="23" fill="white" opacity="0.2"/>
  <text x="600" y="102" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#fff" letter-spacing="4">CODE PROMO</text>
  <!-- Emoji -->
  <text x="600" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="90">🏷️</text>
  <!-- Titre ligne 1 -->
  <text x="600" y="290" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#fff" filter="url(#shadow)">Code Promo Weleda Fevrier 2026 :</text>
  <!-- Titre ligne 2 -->
  <text x="600" y="348" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#fff" filter="url(#shadow)">Tous les Codes Verifies</text>
  <!-- Sous-titre -->
  <text x="600" y="398" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#fff" opacity="0.85">Codes promo Weleda verifies pour fevrier 2026. 20% sur une s</text>
  <!-- Séparateur -->
  <rect x="500" y="422" width="200" height="2" rx="1" fill="#fff" opacity="0.3"/>
  <!-- Branding Kado -->
  <text x="600" y="466" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#fff" opacity="0.65" letter-spacing="3">Kado</text>
  <text x="600" y="492" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#fff" opacity="0.4">kado-box.fr</text>
</svg>