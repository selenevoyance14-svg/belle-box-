<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fce7f3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fff5f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#fff5f7"/>
  <circle cx="200" cy="150" r="130" fill="url(#bg-glow)"/>
  
        <!-- Sun -->
        <circle cx="200" cy="80" r="25" fill="#fbbf24" opacity="0.4"/>
        <circle cx="200" cy="80" r="15" fill="#fbbf24" opacity="0.6"/>
        <!-- Rays -->
        <line x1="200" y1="45" x2="200" y2="38" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
        <line x1="225" y1="55" x2="230" y2="50" stroke="#fbbf24" stroke-width="2" opacity="0.3"/>
        <line x1="175" y1="55" x2="170" y2="50" stroke="#fbbf24" stroke-width="2" opacity="0.3"/>
        <!-- Sunscreen tube -->
        <rect x="170" y="120" width="60" height="70" rx="10" fill="#fce7f3" opacity="0.6" stroke="#d4af37" stroke-width="1.5"/>
        <!-- SPF text -->
        <text x="200" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#d4af37" opacity="0.7">SPF</text>
        
  <!-- Decorative dots -->
  <circle cx="80" cy="50" r="3" fill="#f9a8d4" opacity="0.4"/>
  <circle cx="320" cy="60" r="2" fill="#d4af37" opacity="0.3"/>
  <circle cx="75" cy="240" r="2" fill="#be185d" opacity="0.2"/>
  <circle cx="330" cy="230" r="3" fill="#f9a8d4" opacity="0.3"/>
  <circle cx="60" cy="150" r="1.5" fill="#d4af37" opacity="0.25"/>
  <circle cx="340" cy="140" r="2" fill="#be185d" opacity="0.2"/>
</svg>