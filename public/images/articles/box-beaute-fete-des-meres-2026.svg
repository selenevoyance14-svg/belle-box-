<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fce7f3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fff5f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#fff5f7"/>
  <circle cx="200" cy="150" r="130" fill="url(#bg-glow)"/>
  
        <!-- Gift box -->
        <rect x="140" y="130" width="120" height="90" rx="6" fill="#be185d" opacity="0.7"/>
        <rect x="140" y="130" width="120" height="90" rx="6" fill="none" stroke="#d4af37" stroke-width="1.5"/>
        <!-- Lid -->
        <rect x="135" y="115" width="130" height="20" rx="4" fill="#d4174d" opacity="0.8"/>
        <rect x="135" y="115" width="130" height="20" rx="4" fill="none" stroke="#d4af37" stroke-width="1.5"/>
        <!-- Ribbon -->
        <line x1="200" y1="115" x2="200" y2="220" stroke="#d4af37" stroke-width="3"/>
        <line x1="140" y1="175" x2="260" y2="175" stroke="#d4af37" stroke-width="3"/>
        <!-- Bow -->
        <ellipse cx="185" cy="108" rx="18" ry="12" fill="#d4af37" opacity="0.6" transform="rotate(-20 185 108)"/>
        <ellipse cx="215" cy="108" rx="18" ry="12" fill="#d4af37" opacity="0.6" transform="rotate(20 215 108)"/>
        <!-- Hearts -->
        <path d="M120 90 C120 80, 135 80, 135 90 C135 100, 120 108, 120 108 C120 108, 105 100, 105 90 C105 80, 120 80, 120 90Z" fill="#f9a8d4" opacity="0.5" transform="scale(0.5) translate(100 60)"/>
        
  <!-- Decorative dots -->
  <circle cx="80" cy="50" r="3" fill="#f9a8d4" opacity="0.4"/>
  <circle cx="320" cy="60" r="2" fill="#d4af37" opacity="0.3"/>
  <circle cx="75" cy="240" r="2" fill="#be185d" opacity="0.2"/>
  <circle cx="330" cy="230" r="3" fill="#f9a8d4" opacity="0.3"/>
  <circle cx="60" cy="150" r="1.5" fill="#d4af37" opacity="0.25"/>
  <circle cx="340" cy="140" r="2" fill="#be185d" opacity="0.2"/>
</svg>