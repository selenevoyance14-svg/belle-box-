        <rect x="220" y="115" width="25" height="55" rx="3" fill="#5a3e1b" opacity="0.5"/>
        <line x1="225" y1="170" x2="225" y2="190" stroke="#5a3e1b" stroke-width="2" opacity="0.4"/>
        <line x1="232" y1="170" x2="232" y2="190" stroke="#5a3e1b" stroke-width="2" opacity="0.4"/>
        <line x1="239" y1="170" x2="239" y2="190" stroke="#5a3e1b" stroke-width="2" opacity="0.4"/>
        <!-- Scissors -->
        <circle cx="155" cy="145" r="12" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.5"/>
        <circle cx="155" cy="175" r="12" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.5"/>
        
  <!-- Decorative dots -->
  <circle cx="80" cy="50" r="3" fill="#f9a8d4" opacity="0.4"/>
