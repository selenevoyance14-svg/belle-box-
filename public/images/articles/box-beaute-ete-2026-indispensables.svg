<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fce7f3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fff5f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#fff5f7"/>
  <circle cx="200" cy="150" r="130" fill="url(#bg-glow)"/>
  
        <!-- Sun -->
        <circle cx="200" cy="100" r="30" fill="#d4af37" opacity="0.4"/>
        <circle cx="200" cy="100" r="20" fill="#d4af37" opacity="0.6"/>
        <!-- Sun rays -->
        <line x1="200" y1="60" x2="200" y2="50" stroke="#d4af37" stroke-width="2" opacity="0.4"/>
        <line x1="225" y1="70" x2="232" y2="62" stroke="#d4af37" stroke-width="2" opacity="0.3"/>
        <line x1="175" y1="70" x2="168" y2="62" stroke="#d4af37" stroke-width="2" opacity="0.3"/>
        <!-- Beauty products -->
        <rect x="155" y="140" width="30" height="60" rx="5" fill="#be185d" opacity="0.6"/>
        <rect x="195" y="135" width="25" height="65" rx="4" fill="#f9a8d4" opacity="0.7"/>
        <circle cx="240" cy="175" r="18" fill="#be185d" opacity="0.4" stroke="#d4af37" stroke-width="1"/>
        
  <!-- Decorative dots -->
  <circle cx="80" cy="50" r="3" fill="#f9a8d4" opacity="0.4"/>
  <circle cx="320" cy="60" r="2" fill="#d4af37" opacity="0.3"/>
  <circle cx="75" cy="240" r="2" fill="#be185d" opacity="0.2"/>
  <circle cx="330" cy="230" r="3" fill="#f9a8d4" opacity="0.3"/>
  <circle cx="60" cy="150" r="1.5" fill="#d4af37" opacity="0.25"/>
  <circle cx="340" cy="140" r="2" fill="#be185d" opacity="0.2"/>
</svg>