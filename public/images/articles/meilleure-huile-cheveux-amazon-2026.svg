<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fce7f3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fff5f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#fff5f7"/>
  <circle cx="200" cy="150" r="130" fill="url(#bg-glow)"/>
  
        <!-- Oil bottle -->
        <rect x="180" y="105" width="40" height="85" rx="5" fill="#d4af37" opacity="0.3" stroke="#d4af37" stroke-width="1.5"/>
        <!-- Cap -->
        <rect x="190" y="90" width="20" height="18" rx="3" fill="#d4af37" opacity="0.5"/>
        <!-- Oil drop -->
        <ellipse cx="200" cy="200" rx="6" ry="8" fill="#d4af37" opacity="0.4"/>
        <!-- Hair strands -->
        <path d="M155 100 Q165 150 155 200" fill="none" stroke="#be185d" stroke-width="2" opacity="0.3"/>
        <path d="M250 95 Q240 150 250 200" fill="none" stroke="#be185d" stroke-width="2" opacity="0.3"/>
        
  <!-- Decorative dots -->
  <circle cx="80" cy="50" r="3" fill="#f9a8d4" opacity="0.4"/>
  <circle cx="320" cy="60" r="2" fill="#d4af37" opacity="0.3"/>
  <circle cx="75" cy="240" r="2" fill="#be185d" opacity="0.2"/>
  <circle cx="330" cy="230" r="3" fill="#f9a8d4" opacity="0.3"/>
  <circle cx="60" cy="150" r="1.5" fill="#d4af37" opacity="0.25"/>
  <circle cx="340" cy="140" r="2" fill="#be185d" opacity="0.2"/>
</svg>