<svg width="800" height="160" viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="160" rx="16" fill="#fff8f0" stroke="#ffe0b2" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e65100">⚡ Résiliation en 3 étapes simples</text>
  
  <circle cx="125" cy="95" r="32" fill="#e65100"/>
  <text x="125" y="102" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#fff">1</text>
  <text x="125" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#e65100">Connectez-vous</text>
  <text x="125" y="156" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#777">à votre compte</text>
  <circle cx="325" cy="95" r="32" fill="#e65100"/>
  <text x="325" y="102" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#fff">2</text>
  <text x="325" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#e65100">Mon abonnement</text>
  <text x="325" y="156" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#777">→ Résilier</text>
  <circle cx="525" cy="95" r="32" fill="#e65100"/>
  <text x="525" y="102" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#fff">3</text>
  <text x="525" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#e65100">Confirmez</text>
  <text x="525" y="156" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#777">et notez la confirmation</text>
  <line x1="125" y1="95" x2="225" y2="95" stroke="#e65100" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="325" y1="95" x2="425" y2="95" stroke="#e65100" stroke-width="2" stroke-dasharray="6,3"/>
</svg>