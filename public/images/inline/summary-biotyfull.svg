<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d6a4f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2d6a4f;stop-opacity:0.85"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="200" rx="4" fill="rgba(255,255,255,0.4)"/>
  <!-- Box name -->
  <text x="36" y="70" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="32" font-weight="800" fill="#fff">Biotyfull Box</text>
  <!-- Badge -->
  <rect x="36" y="90" width="128" height="28" rx="14" fill="rgba(255,255,255,0.2)"/>
  <text x="48" y="110" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#fff" letter-spacing="1">BIO CERTIFIÉE</text>
  <!-- Stars -->
  <text x="36" y="150" font-family="system-ui,sans-serif" font-size="24" fill="#FFD700">★★★★★</text>
  <text x="116" y="150" font-family="system-ui,sans-serif" font-size="18" fill="#fff" opacity="0.8"> 4.8/5</text>
  <!-- Price -->
  <text x="700" y="80" text-anchor="end" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="#fff">23.90€</text>
  <text x="700" y="110" text-anchor="end" font-family="system-ui,sans-serif" font-size="15" fill="#fff" opacity="0.7">par mois</text>
  <!-- Kado label -->
  <text x="700" y="165" text-anchor="end" font-family="Georgia,serif" font-size="13" fill="#fff" opacity="0.45">kado-box.fr</text>
</svg>