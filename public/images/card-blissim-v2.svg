<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#FF5252"/> <!-- Fond rouge vibrant -->
  
  <!-- Ombre portée globale -->
  <ellipse cx="300" cy="220" rx="200" ry="100" fill="black" opacity="0.1"/>

  <!-- Poudrier Blush (Orange/Terracotta) -->
  <circle cx="200" cy="220" r="50" fill="#E64A19" stroke="#FFCC80" stroke-width="2"/>
  <circle cx="200" cy="220" r="45" fill="#FFAB91"/>
  <!-- Logo fictif sur blush -->
  <path d="M190 210 L210 210 L200 230 Z" fill="white" opacity="0.5"/> 

  <!-- Pinceau Maquillage -->
  <rect x="300" y="80" width="20" height="150" transform="rotate(45 300 80)" fill="#D7CCC8"/> <!-- Manche -->
  <rect x="395" y="175" width="25" height="40" transform="rotate(45 395 175)" fill="#8D6E63"/> <!-- Virole -->
  <ellipse cx="430" cy="210" rx="25" ry="35" transform="rotate(45 430 210)" fill="#FFE0B2"/> <!-- Poils -->
  <ellipse cx="435" cy="215" rx="20" ry="30" transform="rotate(45 435 215)" fill="#FFFFFF" opacity="0.3"/> <!-- Reflet poils -->

  <!-- Mascara Noir -->
  <rect x="150" y="300" width="180" height="30" rx="5" transform="rotate(-10 150 300)" fill="black"/>
  <rect x="150" y="305" width="180" height="10" transform="rotate(-10 150 305)" fill="#424242"/> <!-- Reflet -->
  <text x="180" y="315" transform="rotate(-10 180 315)" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">BLISSIM</text>

  <!-- Gloss Brillant -->
  <rect x="350" y="50" width="30" height="120" rx="5" transform="rotate(-20 350 50)" fill="#FFCDD2"/>
  <rect x="360" y="150" width="30" height="40" transform="rotate(-20 360 150)" fill="#F48FB1"/> <!-- Liquide -->
  <rect x="350" y="50" width="30" height="20" transform="rotate(-20 350 50)" fill="#E0E0E0"/> <!-- Bouchon -->
  
  <!-- Éléments déco (éclats) -->
  <circle cx="100" cy="100" r="5" fill="white" opacity="0.6"/>
  <circle cx="500" cy="300" r="3" fill="white" opacity="0.4"/>
  <circle cx="550" cy="50" r="8" fill="#FFCDD2" opacity="0.5"/>

</svg>
