# ==================================
# KADO BOX — Sources Produits Amazon
# ==================================
# Pour ajouter un produit : ASIN + occasion + destinataire
# Lance ensuite : npm run sync-amazon
#
# Occasions : fete-des-meres, fete-des-peres, noel, paques, saint-valentin, anniversaire
# Destinataires : femme, homme, enfant, ado, couple, bebe
# ==================================

# Le crawler partira de ces ASIN seeds et explorera les produits voisins
# pour étoffer le catalogue automatiquement.

